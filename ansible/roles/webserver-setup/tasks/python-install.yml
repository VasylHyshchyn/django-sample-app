---
- name: Install Python packages
  become: true
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-dev
      - build-essential
      - libpq-dev
    state: present
    update_cache: true

- name: Create Django system user
  become: true
  ansible.builtin.user:
    name: "{{ django_user }}"
    system: true
    create_home: true
    home: /home/{{ django_user }}
    shell: /bin/bash

- name: Create Django application directory
  become: true
  ansible.builtin.file:
    path: "{{ django_app_dir }}"
    state: directory
    owner: "{{ django_user }}"
    group: "{{ django_group }}"
    mode: "0755"